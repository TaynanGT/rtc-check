[project]
name = "rtc-check"
version = "0.1.1"
description = "Auditoria local de prontidão da NF-e para a Reforma Tributária (IBS/CBS)"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["nfe", "sefaz", "reforma-tributaria", "ibs", "cbs", "fiscal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.scripts]
rtc-check = "rtc_check.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtc_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
# Cobertura de galho, nao so de linha: os defeitos que escaparam desta suite
# moravam todos em galho nao tomado dentro de linha ja contada como coberta.
branch = true
source = ["rtc_check"]
omit = [
    # Exercitado de verdade por test_executavel_como_modulo, que roda
    # `python -m rtc_check` num subprocess. O coverage do processo pai nao
    # enxerga esse subprocess, e medir daqui daria um 0% mentiroso.
    "*/rtc_check/__main__.py",
]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["rtc_check"]
mypy_path = "src"
strict = true

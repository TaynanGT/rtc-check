[project]
name = "rtc-check"
version = "0.6.0"
description = "Auditoria local de prontidão da NF-e para a Reforma Tributária (IBS/CBS)"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
    "nfe",
    "nfce",
    "sefaz",
    "reforma-tributaria",
    "ibs",
    "cbs",
    "fiscal",
    "xml",
    "compliance",
    "brasil",
    "nota-fiscal",
    "erp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: System Administrators",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Text Processing :: Markup :: XML",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=48.0.1,<50",
    "defusedxml>=0.7,<1",
]

[project.urls]
Homepage = "https://taynangt.github.io/rtc-check/"
Documentation = "https://github.com/TaynanGT/rtc-check#readme"
Repository = "https://github.com/TaynanGT/rtc-check"
Issues = "https://github.com/TaynanGT/rtc-check/issues"
Changelog = "https://github.com/TaynanGT/rtc-check/blob/main/CHANGELOG.md"
Planos = "https://taynangt.github.io/rtc-check/#precos"

[project.scripts]
rtc-check = "rtc_check.cli:main"
rtc-check-desktop = "rtc_check.webapp:main"
rtc-check-vendas = "rtc_check.servidor_vendas:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-defusedxml>=0.7",
]
browser = [
    "playwright>=1.54,<2",
]
build = [
    "pyinstaller>=6.14,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtc_check"]

[tool.hatch.build]
include = [
    "src/rtc_check/**/*.py",
    "src/rtc_check/web/*.html",
    "src/rtc_check/web/*.css",
    "src/rtc_check/web/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "browser: smoke tests reais da interface com Chromium",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["rtc_check"]
mypy_path = "src"
strict = true

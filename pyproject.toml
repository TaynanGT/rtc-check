[project]
name = "rtc-check"
version = "0.1.2"
description = "Auditoria local de prontidão da NF-e para a Reforma Tributária (IBS/CBS)"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["nfe", "sefaz", "reforma-tributaria", "ibs", "cbs", "fiscal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.urls]
Homepage = "https://taynangt.github.io/rtc-check/"
Repository = "https://github.com/TaynanGT/rtc-check"
Changelog = "https://github.com/TaynanGT/rtc-check/blob/main/CHANGELOG.md"

[project.scripts]
rtc-check = "rtc_check.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtc_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["rtc_check"]
mypy_path = "src"
strict = true

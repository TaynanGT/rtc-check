name: Publicar release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      # Nao publica release de codigo quebrado.
      - name: Rodar a suite antes de empacotar
        run: |
          uv venv --python 3.13 --clear
          uv pip install -e ".[dev]"
          uv run ruff check .
          uv run mypy
          uv run pytest -q

      - name: Construir wheel e sdist
        run: uv build

      - name: Conferir que a versao do tag bate com a do pacote
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv run python -c "import rtc_check; print(rtc_check.__version__)")
          echo "tag=$tag pacote=$pkg"
          [ "$tag" = "$pkg" ] || { echo "tag $tag diferente da versao $pkg"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: pacotes
          path: dist/

  github-release:
    needs: construir
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pacotes
          path: dist/

      - name: Anexar os pacotes ao release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  pypi:
    needs: construir
    runs-on: ubuntu-latest
    # So roda depois que a publicacao confiavel estiver registrada no PyPI.
    # Ligue com: gh variable set PYPI_HABILITADO --body true
    # Sem isso o job e pulado, em vez de falhar com invalid-publisher e deixar
    # o release vermelho por causa de uma etapa que ainda nao foi configurada.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_HABILITADO == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/rtc-check
    permissions:
      id-token: write # exigido pela publicacao confiavel (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pacotes
          path: dist/

      # Publicacao confiavel: o GitHub prova a identidade do workflow via OIDC
      # e o PyPI emite um token efemero. Nenhum segredo fica guardado no repo.
      - uses: pypa/gh-action-pypi-publish@release/v1

name: Publicar release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"

      # Nao publica release de codigo quebrado.
      - name: Rodar a suite antes de empacotar
        run: |
          uv venv --python 3.13 --clear
          uv pip install -e ".[dev]"
          uv run ruff check .
          uv run mypy
          uv run pytest -q
          uvx --from bandit bandit -q -r src
          uvx pip-audit --strict

      - name: Construir wheel e sdist
        run: uv build

      - name: Conferir que a versao do tag bate com a do pacote
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv run python -c "import rtc_check; print(rtc_check.__version__)")
          echo "tag=$tag pacote=$pkg"
          [ "$tag" = "$pkg" ] || { echo "tag $tag diferente da versao $pkg"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pacotes
          path: dist/

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"

      - name: Construir aplicativo portátil
        shell: pwsh
        run: .\scripts\Build-Windows.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-desktop
          path: dist/RTC-Check-Windows-*.zip

  github-release:
    needs: [construir, windows-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pacotes
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-desktop
          path: dist-windows/

      # Cria o release se ainda nao existir. So fazer upload assume que alguem
      # criou o release na mao antes de empurrar a tag, o que quebrou a v0.1.1
      # com "release not found".
      - name: Criar ou atualizar o release com os pacotes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          find dist dist-windows -type f -maxdepth 2 -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "release $tag ja existe, anexando os pacotes"
            gh release upload "$tag" dist/* dist-windows/* SHA256SUMS.txt --clobber
          else
            echo "criando release $tag"
            gh release create "$tag" dist/* dist-windows/* SHA256SUMS.txt \
              --title "RTC Check ${tag#v}" \
              --notes-from-tag
          fi

  pypi:
    needs: construir
    runs-on: ubuntu-latest
    # So roda depois que a publicacao confiavel estiver registrada no PyPI.
    # Ligue com: gh variable set PYPI_HABILITADO --body true
    # Sem isso o job e pulado, em vez de falhar com invalid-publisher e deixar
    # o release vermelho por causa de uma etapa que ainda nao foi configurada.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_HABILITADO == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/rtc-check
    permissions:
      id-token: write # exigido pela publicacao confiavel (OIDC)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pacotes
          path: dist/

      # Publicacao confiavel: o GitHub prova a identidade do workflow via OIDC
      # e o PyPI emite um token efemero. Nenhum segredo fica guardado no repo.
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1

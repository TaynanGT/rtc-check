name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # --clear porque o setup-uv, quando recebe python-version, ja deixa um
      # .venv criado e o uv venv se recusa a sobrescrever.
      - name: Criar ambiente isolado
        run: uv venv --python ${{ matrix.python }} --clear

      - name: Instalar dependências
        run: uv pip install -e ".[dev]"

      # Sem isto a matriz mente: sem fixar a versão, todo job cai no Python do
      # runner e o CI fica verde sem nunca ter testado 3.11 nem 3.14.
      - name: Confirmar que o Python em uso é o da matriz
        run: >
          uv run python -c "import sys;
          v='.'.join(map(str, sys.version_info[:2]));
          assert v == '${{ matrix.python }}', f'matriz pediu ${{ matrix.python }}, veio {v}';
          print('Python em uso:', sys.version)"

      - name: Lint
        run: uv run ruff check .

      - name: Validar JavaScript da interface
        run: node --check src/rtc_check/web/app.js

      - name: Tipos
        run: uv run mypy

      - name: Testes
        run: uv run pytest --cov=rtc_check --cov-report=term-missing --cov-fail-under=90

  instalacao-limpa:
    name: Instalação limpa a partir do wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Construir o pacote
        run: uv build

      - name: Conferir que a interface visual entrou no wheel
        shell: bash
        run: >
          uv run python -c "import zipfile,glob;
          p=glob.glob('dist/*.whl')[0];
          n=zipfile.ZipFile(p).namelist();
          assert 'rtc_check/web/index.html' in n;
          assert 'rtc_check/web/app.css' in n;
          assert 'rtc_check/web/app.js' in n;
          print('interface visual presente no wheel')"

      - name: Instalar só o wheel, sem as dependências de dev
        shell: bash
        run: |
          uv venv .limpo --clear
          uv pip install --python .limpo dist/*.whl

      - name: Rodar o binário instalado e conferir o exit code
        shell: bash
        # Diretório de config próprio: o smoke test não pode ler nem gastar
        # licença de quem roda, e o teste grátis é local ao diretório.
        env:
          RTC_CHECK_HOME: config-do-ci
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=.limpo/Scripts/rtc-check.exe
          else
            BIN=.limpo/bin/rtc-check
          fi

          conferir() {  # conferir <esperado> <descrição> <args...>
            esperado=$1; descricao=$2; shift 2
            set +e
            "$BIN" "$@" > /dev/null
            codigo=$?
            set -e
            [ "$codigo" -eq "$esperado" ] \
              || { echo "$descricao: esperado exit $esperado, veio $codigo"; exit 1; }
          }

          "$BIN" --version

          # Plano Comunidade, recém-instalado: a varredura funciona para todo
          # mundo, e o que é pago avisa em vez de rodar pela metade.
          conferir 0 "varredura gratuita" tests/fixtures
          conferir 3 "portão de CI sem plano" tests/fixtures --falhar-em-bloqueio
          conferir 3 "exportação sem plano" tests/fixtures --formato csv

          # Com o teste grátis liberado, o portão de CI passa a valer.
          "$BIN" --iniciar-teste > /dev/null

          # Acervo com bloqueio conhecido: precisa sair 1.
          conferir 1 "acervo com bloqueio" tests/fixtures --falhar-em-bloqueio

          # Pasta vazia: precisa sair 0.
          mkdir -p vazia
          conferir 0 "acervo limpo" vazia --falhar-em-bloqueio

          echo "exit codes corretos nos cinco cenários"

  seguranca:
    name: Segurança e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
      - name: Análise estática de segurança
        run: uvx --from bandit bandit -q -r src
      - name: Auditoria de vulnerabilidades conhecidas
        run: uvx pip-audit --strict

  interface:
    name: Interface real no Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"
      - name: Instalar aplicação e navegador
        run: |
          uv venv --python 3.13 --clear
          uv pip install -e ".[dev,browser]"
          uv run playwright install --with-deps chromium
      - name: Testar fluxo visual
        run: uv run pytest -m browser tests/test_browser.py
      - name: Validar landing
        run: uv run python scripts/validate_site.py

  ci-concluido:
    name: CI concluído
    if: always()
    needs: [testes, instalacao-limpa, seguranca, interface]
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar todos os jobs
        env:
          TESTES: ${{ needs.testes.result }}
          INSTALACAO_LIMPA: ${{ needs.instalacao-limpa.result }}
          SEGURANCA: ${{ needs.seguranca.result }}
          INTERFACE: ${{ needs.interface.result }}
        run: |
          test "$TESTES" = success
          test "$INSTALACAO_LIMPA" = success
          test "$SEGURANCA" = success
          test "$INTERFACE" = success
          echo "matriz, instalação limpa, segurança e interface aprovadas"

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # --clear porque o setup-uv, quando recebe python-version, ja deixa um
      # .venv criado e o uv venv se recusa a sobrescrever.
      - name: Criar ambiente isolado
        run: uv venv --python ${{ matrix.python }} --clear

      - name: Instalar dependências
        run: uv pip install -e ".[dev]"

      # Sem isto a matriz mente: sem fixar a versão, todo job cai no Python do
      # runner e o CI fica verde sem nunca ter testado 3.11 nem 3.14.
      - name: Confirmar que o Python em uso é o da matriz
        run: >
          uv run python -c "import sys;
          v='.'.join(map(str, sys.version_info[:2]));
          assert v == '${{ matrix.python }}', f'matriz pediu ${{ matrix.python }}, veio {v}';
          print('Python em uso:', sys.version)"

      - name: Lint
        run: uv run ruff check .

      - name: Tipos
        run: uv run mypy

      - name: Testes
        run: uv run pytest --cov=rtc_check --cov-report=term-missing --cov-fail-under=90

  instalacao-limpa:
    name: Instalação limpa a partir do wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Construir o pacote
        run: uv build

      - name: Instalar só o wheel, sem as dependências de dev
        shell: bash
        run: |
          uv venv .limpo --clear
          uv pip install --python .limpo dist/*.whl

      - name: Rodar o binário instalado e conferir o exit code
        shell: bash
        # Diretório de config próprio: o smoke test não pode ler nem gastar
        # licença de quem roda, e o teste grátis é local ao diretório.
        env:
          RTC_CHECK_HOME: config-do-ci
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN=.limpo/Scripts/rtc-check.exe
          else
            BIN=.limpo/bin/rtc-check
          fi

          conferir() {  # conferir <esperado> <descrição> <args...>
            esperado=$1; descricao=$2; shift 2
            set +e
            "$BIN" "$@" > /dev/null
            codigo=$?
            set -e
            [ "$codigo" -eq "$esperado" ] \
              || { echo "$descricao: esperado exit $esperado, veio $codigo"; exit 1; }
          }

          "$BIN" --version

          # Plano Comunidade, recém-instalado: a varredura funciona para todo
          # mundo, e o que é pago avisa em vez de rodar pela metade.
          conferir 0 "varredura gratuita" tests/fixtures
          conferir 3 "portão de CI sem plano" tests/fixtures --falhar-em-bloqueio
          conferir 3 "exportação sem plano" tests/fixtures --formato csv

          # Com o teste grátis liberado, o portão de CI passa a valer.
          "$BIN" --iniciar-teste > /dev/null

          # Acervo com bloqueio conhecido: precisa sair 1.
          conferir 1 "acervo com bloqueio" tests/fixtures --falhar-em-bloqueio

          # Pasta vazia: precisa sair 0.
          mkdir -p vazia
          conferir 0 "acervo limpo" vazia --falhar-em-bloqueio

          echo "exit codes corretos nos cinco cenários"

  ci-concluido:
    name: CI concluído
    if: always()
    needs: [testes, instalacao-limpa]
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar todos os jobs
        env:
          TESTES: ${{ needs.testes.result }}
          INSTALACAO_LIMPA: ${{ needs.instalacao-limpa.result }}
        run: |
          test "$TESTES" = success
          test "$INSTALACAO_LIMPA" = success
          echo "matriz e instalação limpa aprovadas"
